<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Offline - Virat CRM</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f8fafc;
      color: #0f172a;
      text-align: center;
      padding: 20px;
    }
    .icon {
      width: 80px;
      height: 80px;
      margin-bottom: 24px;
      color: #64748b;
    }
    h1 {
      font-size: 24px;
      margin: 0 0 12px 0;
      font-weight: 700;
    }
    p {
      color: #64748b;
      margin: 0 0 32px 0;
      max-width: 300px;
      line-height: 1.5;
    }
    button {
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
      transition: background-color 0.2s;
    }
    button:active {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>
  <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 3l18 18M9.9 5.53a9 9 0 0111.08 11.07M4.32 4.32A9 9 0 0019.68 19.68M12 12v.01" />
  </svg>
  
  <h1>You are offline</h1>
  <p>Please check your internet connection and try again.</p>
  
  <button onclick="window.location.reload()">Retry Connection</button>
</body>
</html>
